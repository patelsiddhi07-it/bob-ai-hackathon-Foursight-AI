submission:
  title: "FourSight AI — Mission Readiness & Predictive Maintenance Copilot" # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Military organizations need to reliably determine whether aircraft and other equipment are mission-ready, but maintenance is often based on fixed schedules rather than the actual condition of each asset. This can lead to unexpected equipment failures and reduced operational readiness. FourSight AI analyzes sensor data and service records to identify non-ready assets, explain readiness issues, and help maintenance teams act before critical failures occur.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    FourSight AI is an AI-powered mission readiness and predictive maintenance copilot that analyzes equipment sensor data and service records to assess asset readiness and identify potential maintenance issues. It explains the reasons behind each readiness status, predicts components that may fail before the next mission window, and generates a prioritized maintenance plan so maintenance teams can take action proactively.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Mission Readiness Assessment — Automatically classifies each asset as Ready, At Risk, or Not Ready based on sensor data and service records."
    - "Explainable Readiness Analysis — Clearly explains the key sensor abnormalities, maintenance history, and other factors affecting an asset's readiness status."
    - "Predictive Failure Detection — Identifies components at risk of failure before the next mission window using equipment condition and historical maintenance data."
    - "Prioritized Maintenance Plan — Recommends maintenance actions and prioritizes assets based on failure risk and mission-readiness impact."
    - "Mission Readiness Dashboard — Provides a centralized view of asset health, readiness status, risk levels, predicted failures, and recommended actions."

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"] # REQUIRED
    frameworks: ["FastAPI", "React"]                   # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]                      # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite"]                              # e.g., ["PostgreSQL", "Redis"]
    other: ["Git", "GitHub", "GitHub Actions"]         # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended
    FourSight AI turns raw equipment condition and maintenance data into actionable mission-readiness intelligence. Instead of simply showing sensor values, our solution connects readiness assessment, explainable risk analysis, predictive failure detection, and prioritized maintenance recommendations in one copilot workflow. We are especially proud of building the solution around the real operational challenge of preventing unexpected equipment failures before a mission, while keeping the system explainable.

  known_limitations: >                 # Optional but recommended
    Hackathon MVP Scope: The system is designed as a functional proof of concept and may require additional testing. Dataset Dependency: Prediction quality depends on the availability and completeness of sensor/service data. Predictive Accuracy: Failure predictions are intended to support decisions and are not guaranteed. Limited Validation: Not yet validated on live military equipment.

